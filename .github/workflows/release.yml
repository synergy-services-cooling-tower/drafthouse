# Synergy Drafthouse — the public repository's release.
#
# This file is a public snapshot's release pipeline, generated by the private repository's snapshot builder
# (`scripts/public-snapshot.mjs`); it is never copied from that repository's `.github/`.
# A `v*` tag builds the servable cockpit plane at the tagged commit — the document, the built wasm
# module and the committed assets — gates the payload's gzip size, packs the deterministic archive
# with its manifest and `.sha256` sidecar, and publishes all three on a GitHub Release, so a
# deployment can pin a release by tag plus the archive's sha256. A `workflow_dispatch` is a dry
# run: the same chain runs, the products go up as workflow artifacts, and no Release is created.
#
# Nothing here needs a repository secret: public repository runners are free, the tree this runs in
# is the synthetic catalog only, and the one credential used is the default `GITHUB_TOKEN`.
# `tests/workflow-lint.test.js` recognises a generated workflow by the sentence above.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Builds the plane and publishes it. `contents: write` is needed only by the publish step, which
  # runs on a tag push; the dry run holds the same token and never uses it.
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # A tag push publishes a Release; a dispatch is a dry run that never creates one.
      PUBLISHES: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install the Rust toolchain pinned by cockpit/rust-toolchain.toml
        run: |
          channel="$(sed -n 's/^channel *= *"\([^"]*\)"$/\1/p' cockpit/rust-toolchain.toml)"
          test -n "$channel"
          rustup toolchain install --no-self-update --profile minimal "$channel"
          rustup target add --toolchain "$channel" wasm32-unknown-unknown
          rustup default "$channel"

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Cache cargo home and the cockpit's target directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo
            cockpit/target
          key: ${{ runner.os }}-cockpit-${{ hashFiles('cockpit/Cargo.toml', 'cockpit/Cargo.lock', 'cockpit/rust-toolchain.toml', 'cockpit/contract/Cargo.toml', 'cockpit/seams/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cockpit-

      # The tree is a synthetic-catalog snapshot; assert the marker the leak gate requires on every
      # catalog before anything is built, so a release cannot be cut from a tree whose data has
      # drifted away from SYNTHETIC / NOT VENDOR DATA.
      - name: Assert this is the synthetic-catalog tree (the marker the leak gate requires)
        run: |
          grep -Eiq 'synthetic' src/data/sampleCatalog.js
          grep -Eiq 'synthetic' cockpit/assets/fixture.json
          echo "synthetic catalog markers present"

      - name: Build the plane and assert the gzip size gate (refuses above 8 MiB gzipped or the committed budget)
        run: cockpit/tools/build-web.sh release

      - name: Pack the plane — the deterministic archive, its manifest and its .sha256 sidecar
        run: node scripts/cockpit-artifact.mjs --write dist/cockpit

      - name: Assert the packed plane carries all three parts — the document, the built module and the assets
        run: |
          node -e "const manifest = require('./dist/cockpit/drafthouse-cockpit-' + require('./package.json').version + '.manifest.json'); const paths = new Set(manifest.files.map((file) => file.path)); for (const part of ['cockpit/index.html', 'cockpit/pkg/drafthouse_cockpit.js', 'cockpit/pkg/drafthouse_cockpit_bg.wasm']) { if (!paths.has(part)) { throw new Error('the plane is missing ' + part); } } if (![...paths].some((path) => path.startsWith('cockpit/assets/'))) { throw new Error('the plane is missing cockpit/assets/'); } console.log('the plane carries the document, the built module and ' + [...paths].filter((path) => path.startsWith('cockpit/assets/')).length + ' asset file(s)');"

      - name: Verify every hash from the packed archive (a tampered file cannot reach the Release)
        run: node scripts/cockpit-artifact.mjs --verify dist/cockpit

      - name: Publish the Release
        if: env.PUBLISHES == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --notes "The cockpit plane for $TAG, built from source commit $COMMIT: the deterministic archive, its .sha256 sidecar and the manifest, which lists every file with its digest and names the same commit in its own commit field. Download the assets and re-verify: node scripts/cockpit-artifact.mjs --verify <dir>" \
            dist/cockpit/*

      - name: Upload the plane (dry run — no Release is created)
        if: env.PUBLISHES != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cockpit-plane
          path: dist/cockpit/*
          if-no-files-found: error
          retention-days: 7

  # The round trip: this job never sees the files the `release` job produced — it downloads the
  # published Release assets (the workflow artifact on a dry run) and re-derives every hash from the
  # bytes that arrived, so a corrupted upload cannot pass unnoticed.
  verify:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PUBLISHES: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Download the published Release assets
        if: env.PUBLISHES == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist/downloaded
          gh release download "$TAG" --dir dist/downloaded --pattern 'drafthouse-cockpit-*'
          ls -l dist/downloaded

      - name: Download the uploaded plane (dry run)
        if: env.PUBLISHES != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cockpit-plane
          path: dist/downloaded

      - name: Re-derive every hash from the fresh download
        run: node scripts/cockpit-artifact.mjs --verify dist/downloaded
