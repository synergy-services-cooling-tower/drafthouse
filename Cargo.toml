[workspace]
members = ["crates/*"]
exclude = ["rust"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
as_conversions = "deny"
print_stdout = "deny"
print_stderr = "deny"
allow_attributes_without_reason = "deny"
let_underscore_must_use = "deny"

[profile.wasm]
inherits = "release"
opt-level = 3
lto = true
panic = "abort"
strip = "debuginfo"
