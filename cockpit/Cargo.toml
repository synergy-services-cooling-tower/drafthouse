[package]
name = "drafthouse-cockpit"
version = "0.4.0"
edition = "2021"
description = "Synergy Drafthouse cockpit - the owner-approved visual pass (issue #55), imported as the product UI (issue #58): an illustrative engineering instrument over the engine contract, on the real engine by default."
license = "PolyForm-Noncommercial-1.0.0"
publish = false
# Issue #58: the cockpit is its **own** cargo workspace (see `[workspace]` below), not a member of
# the engine's at `rust/`: the shipped wasm payload's size profile has to live in the root manifest,
# and keeping it here is what leaves `rust/Cargo.toml`, its lock and the pinned engine artifact
# untouched by the import. Its gates are `cd cockpit && cargo test / fmt --check / clippy`, run by
# the `cockpit` CI job and by hand.
[workspace]
members = ["contract", "seams"]

[lib]
crate-type = ["cdylib", "rlib"]

# Issue #71 fix round: the CLI, the window and the run loop (with their tests) live in the lib
# (`src/cli.rs`), so this target is a thin `main` and needs no test harness of its own. `test = false`
# is what stops `cargo test` from linking a Bevy-sized test binary for it - the link that died on the
# CI runner (`ld terminated with signal 7` - the disk/memory exhaustion case). No test is lost: the
# CLI's tests run in the lib's harness; the fix round that proved this is kept with the maintainers.
# `cargo clippy --all-targets` still checks this target (checking never links).
[[bin]]
name = "drafthouse"
path = "src/bin/drafthouse.rs"
test = false

[features]
# Issue #58: the engine selection. `real-engine` (the Rust engine crate, through `cockpit-adapter`)
# is ON by default; the recorded replay (`FixtureEngine`) is behind `fixture-engine` for demos and
# tests, and `?engine=fixture` / `?engine=real` pick it at runtime in a build that carries both.
default = ["real-engine"]
real-engine = ["dep:cockpit-adapter"]
fixture-engine = []
# Round 4, item 1: the 3D tower view is kept in the tree behind this feature and is OFF by default, so the
# default build never links `bevy_pbr` (the 3D module is the only thing that uses it). Build it with
#   wasm-pack build --target web --out-dir pkg --release --features three-d
# or with tools/build-web.sh release three-d. The UI tab, the CELLS toolbar group and the 4 / C keys are
# gone from the default build; with the feature on they come back, so the round-3 3D work stays reachable.
three-d = ["bevy/bevy_pbr"]

[dependencies]
# The engine contract (`engine.rs`), the recorded `FixtureEngine` and `HostConfig`/branding. This is
# the crate the UI is written against; the baseline's own Bevy app is not part of it.
cockpit = { path = "contract" }
# The pass's own seam registry + illustrative mapping. Pure Rust, unit-tested natively.
drafthouse-cockpit-seams = { path = "seams" }
# Issue #58: the cockpit's `Engine` over the repository's real engine (`rust/cockpit-adapter`),
# which is where the physics lives. Optional: `real-engine` (on by default) turns it on.
cockpit-adapter = { path = "../rust/cockpit-adapter", optional = true }
serde = { version = "1", features = ["derive"] }
# Issue #74: a project file's numbers must survive `write -> read -> write` byte for byte, and the
# results snapshot carries the engine's full-precision f64s. serde_json's default float parser is fast but
# not round-trip exact - measured on this file set: `10.345404866101763` reads back as
# `10.345404866101765`, which is a different double and would move a file every time it was opened. The
# `float_roundtrip` feature turns on the exact parser; it is a feature, not a crate, so the dependency
# graph is unchanged.
serde_json = { version = "1", features = ["float_roundtrip"] }
# Same pin, same feature set as the approved baseline: the dependency graph is otherwise identical to
# the baseline's wasm build (only the view layer differs). Default features off: no audio, no
# 3D/PBR, no gltf, no bevy_ui (egui carries the widgets), no picking, no bevy_text.
bevy = { version = "=0.19.1", default-features = false, features = [
  "std",
  "async_executor",
  "bevy_asset",
  "bevy_log",
  "bevy_state",
  "bevy_winit",
  "bevy_window",
  "bevy_camera",
  "bevy_color",
  "bevy_mesh",
  "bevy_shader",
  "bevy_image",
  "bevy_render",
  "bevy_core_pipeline",
  "bevy_sprite",
  "bevy_sprite_render",
  "bevy_gizmos",
  "bevy_gizmos_render",
  # `bevy_pbr` is NOT here: round 4 moved it behind the `three-d` feature (see [features] above), so the
  # default build's dependency graph carries no PBR renderer at all. No gltf, no bevy_scene, no audio,
  # no bevy_ui.
  "webgl2",
  "web",
] }
bevy_egui = { version = "=0.42.0", default-features = false, features = ["render"] }

# Issue #71: the web crates belong to the **web bridge**, not to the crate. They are pulled on the
# wasm target only, so `bridge.rs` (the wasm-bindgen entry + the HTML mirror) can compile there and
# a native build's dependency tree carries no web crate at all - the gate is
#   cargo tree --target <host> -e normal | grep -ciE 'wasm-bindgen|web-sys|js-sys'   -> 0
# The native binary (`src/bin/drafthouse.rs`) has no DOM to mirror into; see the known gap in
# `docs/COCKPIT_SEAMS.md`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"
js-sys = "0.3.104"
web-sys = { version = "0.3.104", features = [
  "Window", "Document", "Element", "HtmlElement", "Performance", "Location", "UrlSearchParams", "console",
] }
console_error_panic_hook = "0.1"

# Issue #74: the native file dialogs (`File > Open / Save As / Import catalog revision…`).
# **Native only, and proved so**: it sits under the same `cfg(not(target_arch = "wasm32"))` split #71 gave
# the web crates, which is the mirror image - so the wasm target's dependency tree carries no `rfd` at all
# (`cargo tree --target wasm32-unknown-unknown -e normal` cannot find it) and the shipped payload does not
# grow by it. The wasm build and its gzip gate are otherwise untouched.
#
# `default-features = false` + `xdg-portal` is deliberate: rfd's default Linux backend wants GTK. The
# portal backend needs no GTK and no display server - but it is **not** "no system library": on **Linux**
# the build needs the Wayland client, because `rfd -> ashpd -> wayland-backend -> wayland-sys` enables
# wayland-sys's `client` feature and its build script runs `Config::new().probe("wayland-client").unwrap()`.
# `libwayland-dev` is the Ubuntu package that ships `wayland-client.pc` and `libwayland-client.so`; the two
# CI jobs that compile this half for Linux (`cockpit`, `cockpit-native`) install it in their apt step. That
# is measured, not assumed: run 35991609300 failed in `wayland-sys v0.31.11` exactly there, and
# `cargo tree --target x86_64-unknown-linux-gnu -e features -i wayland-sys` shows `client` is the only
# wayland-sys feature in this lock (no `cursor`/`egl`/`server`, so no other module is probed). macOS and
# Windows take the platform dialog (AppKit/Win32) and need no such package - which is why this lane's own
# gates, all run on macOS, never saw it. See `docs/PROJECT_FORMAT.md`; the failing run and the
# fix-round note are kept with the maintainers. No HTTP client appears in either tree: this crate has no
# network code of any kind.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-mutable-globals", "--enable-reference-types", "--enable-multivalue"]

# Issue #72: the native installers, from this one manifest. `cargo packager` (0.11.8, the pin in
# `.github/workflows/release.yml`) reads this table; the release workflow's `native` matrix runs it
# on macos-14 / windows-latest / ubuntu-22.04 and publishes the four artifacts, each with a
# `.sha256` sidecar, listed in the native manifest and provenance the same way the bundles are.
#
# **The version is deliberately absent.** `cargo-packager` fills `version` from the crate when the
# field is empty (`cli/config.rs`), and this crate's `[package] version` is already held in
# lockstep with `package.json` by `scripts/version-check.mjs`; typing it here would be a second
# source of truth, and the guard fails if anyone does. `product-name` is set because the display
# name is not the crate name.
#
# `category`: the issue asks for `Engineering`, which `cargo-packager` cannot emit — its category
# enum (and Apple's `LSApplicationCategoryType`) has no engineering value — so the closest entry it
# offers is used here. Changing it is this one line.
#
# `icons`: the neutral mark and the set derived from it by `scripts/native-icons.mjs`
# (`npm run native-icons`, gated by `npm run native-icons-check`). No `.icns` is committed:
# `cargo-packager` packs one from these PNGs (`util::create_icns_file`). The mark is neutral because
# of the private decision record D4b — branding is injected at the deployment boundary, never baked into a
# published product; see D23, where a branded mark is recorded as the owner's call.
#
# macOS signing: `signing-identity` is deliberately **not** here — it is the owner's certificate
# name, not the repository's. The tag path discovers it from the p12 on the runner and writes it
# into that run's copy of this file (`scripts/native-macos-signing.mjs`); a dry run never sets it,
# packages an unsigned artifact and says so. No `entitlements` entry either: the hardened runtime
# with its defaults and no sandbox (the v1 decision). The .deb's declared dependencies are the
# X11/Wayland surface and the Vulkan loader the cockpit's renderer needs on a stock desktop;
# Windows ships unsigned for v1, and the README says the SmartScreen warning is expected.
[package.metadata.packager]
identifier = "com.synergyservices.drafthouse"
product-name = "Synergy Drafthouse"
category = "Utility"
# cargo-packager 0.11.8 ignores the CLI --binaries-dir flag. Set the staging directory
# here, relative to this manifest, so all platforms package the binaries built by the workflow.
binaries-dir = "../dist/packager-bin"
icons = [
  "icons/32x32.png",
  "icons/128x128.png",
  "icons/128x128@2x.png",
  "icons/icon.png",
  "icons/icon.ico",
]

[package.metadata.packager.deb]
depends = [
  "libc6",
  "libx11-6",
  "libxcursor1",
  "libxi6",
  "libxrandr2",
  "libxkbcommon0",
  "libwayland-client0",
  "libvulkan1",
  "libgl1",
  "libegl1",
]


# Issue #58, issue #82: the shipped wasm payload's size profile. `opt-level` was `"z"` at the
# import; issue #82 measured the profile on this app - one real engine run costs 283.5 ms at `"z"`,
# 140.6 ms at `"s"` and 111.3 ms at `"3"` (fat LTO and one codegen unit unchanged, plus
# `panic = "abort"` and stripped symbols) - and the app is engine-bound, so the profile *is* the
# frame budget: `"3"` is the measured choice (the issue's profile matrix; the private decision
# D25). This is the cockpit's workspace root, so the table is read by `tools/build-web.sh release`
# (`wasm-pack build --release`) and by anything else that builds this crate for wasm.
# Two gates measure the payload: `COCKPIT_GZIP_LIMIT_BYTES` (8 MiB default) and the committed
# `cockpit/wasm-budget.json`.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Iteration profile for the cockpit wasm build (`tools/build-web.sh fast`): no LTO, parallel
# codegen, still optimized enough to run under SwiftShader.
[profile.fast]
inherits = "release"
opt-level = 2
