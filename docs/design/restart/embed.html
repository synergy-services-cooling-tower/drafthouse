<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drafthouse embedded in a host app</title>
<link rel="stylesheet" href="site.css"><link rel="stylesheet" href="wizard.css">
<script type="importmap">{"imports":{"three":"../../../web/vendor/three.module.js"}}</script>
<script src="chrome.js"></script><script src="fixture.js"></script>
<style>
body{background:#15171a}
.host{display:grid;grid-template-columns:232px 1fr;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.hs{background:#1b1e22;border-right:1px solid #2a2e33;padding:20px 14px;color:#a3a9b0;font-size:14px;display:grid;align-content:start;gap:4px}
.hs .lg{display:flex;align-items:center;gap:10px;color:#e6e8eb;font-weight:600;padding:4px 10px 20px}
.hs .lg i{width:22px;height:22px;border-radius:6px;background:#3a4048}
.hs a{color:inherit;padding:8px 10px;border-radius:6px}
.hs a.on{background:#262a30;color:#e6e8eb}
.hm{min-width:0}
.ht{height:56px;display:flex;align-items:center;gap:12px;padding:0 28px;border-bottom:1px solid #2a2e33;color:#a3a9b0;font:14px system-ui,sans-serif;background:#1b1e22}
.ht b{color:#e6e8eb;font-weight:600}
.ht .av{margin-left:auto;width:30px;height:30px;border-radius:9999px;background:#3a4048}
.hc{padding:28px}
.slot{font-family:"Montserrat","Noto Sans Thai",system-ui,sans-serif;border:1px dashed #3a4048;border-radius:10px;padding:var(--s-3);background:var(--bg)}
.slot-l{font:12px system-ui,sans-serif;color:#7d848c;margin:0 0 10px 2px;display:flex;justify-content:space-between}
.slot .rail{margin-bottom:var(--s-3)}
.slot h1{font-size:var(--t-lg);margin-bottom:var(--s-3)}
.hb{display:none}
@media (max-width:700px){
  .host{grid-template-columns:1fr}.hs{display:none}
  .ht{padding:0 14px}.hb{display:block;width:20px;height:14px;border-top:2px solid #a3a9b0;border-bottom:2px solid #a3a9b0;position:relative}
  .hb::after{content:"";position:absolute;left:0;right:0;top:4px;border-top:2px solid #a3a9b0}
  .hc{padding:12px}.slot{padding:var(--s-2)}
}
</style></head>
<body>
<div class="host">
  <nav class="hs"><div class="lg"><i></i>Host app</div><a href="#">Dashboard</a><a href="#">Catalog</a><a href="#">Projects</a><a class="on" href="#">Tower sizing</a><a href="#">Settings</a></nav>
  <div class="hm">
    <div class="ht"><span class="hb"></span><span>Projects</span><span>/</span><b>Tower sizing</b><span class="av"></span></div>
    <div class="hc">
      <div class="slot-l"><span>The host's page · the embedded package draws inside the dashed box</span><span>catalog: passed in by the host</span></div>
      <div class="slot">
        <div data-rail></div>
        <h1>What must the tower do?</h1>
        <div class="wz">
          <section class="card form">
            <div class="f"><label>Water flow<small>through the tower</small></label>
              <div class="sl"><div class="t"><i style="width:44%"></i></div><b class="k" style="left:44%"></b><span class="lo">100</span><span class="hi">1,500</span></div>
              <div class="in"><input value="720"><span>m³/h</span></div></div>
            <div class="f"><label>Hot water<small>into the tower</small></label>
              <div class="sl"><div class="t"><i style="width:49%"></i></div><b class="k" style="left:49%"></b><span class="lo">25</span><span class="hi">60 °C</span></div>
              <div class="in"><input value="42.0"><span>°C</span></div></div>
            <div class="f"><label>Cold water wanted<small>out of the basin</small></label>
              <div class="sl"><div class="t"><i style="width:48%"></i></div><b class="k" style="left:48%"></b><span class="lo">20</span><span class="hi">45 °C</span></div>
              <div class="in"><input value="32.0"><span>°C</span></div></div>
            <div class="f"><label>Wet bulb<small>design air, the one that limits</small></label>
              <div class="sl"><div class="t"><i style="width:68%"></i></div><b class="k" style="left:68%"></b><span class="lo">10</span><span class="hi">35 °C</span></div>
              <div class="in"><input value="27.0"><span>°C</span></div></div>
            <div class="f"><label>Dry bulb<small>for air density and evaporation</small></label>
              <div class="sl"><div class="t"><i style="width:57%"></i></div><b class="k" style="left:57%"></b><span class="lo">10</span><span class="hi">50 °C</span></div>
              <div class="in"><input value="33.0"><span>°C</span></div></div>
            <div class="f"><label>Site<small style="margin-top:6px"><span class="seg"><span class="on">Altitude</span><span>Pressure</span></span></small></label>
              <div class="sl"><div class="t"><i style="width:0%"></i></div><b class="k" style="left:0%"></b><span class="lo">0</span><span class="hi">3,000 m</span></div>
              <div class="in"><input value="0"><span>m</span></div></div>
            <div class="acts"><button class="btn ghost"><span>↺ Reset<span class="wide"> to the default duty</span></span></button><button class="btn pri"><span>Next<span class="wide">: site and water</span> →</span></button></div>
          </section>
          <div data-side></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script type="module">
import { wizard } from "./wizard.js";
wizard(1, { embedded: true });
settle();
</script>
</body></html>
